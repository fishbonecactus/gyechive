name: Clip Update

on:
  schedule:
    # 매일 한국 시간 오전 9시
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: |
          pip install requests

      - name: Run update
        run: |
          python update.py

      - name: Save changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          git commit -m "Auto update archive data" || exit 0

          git push
